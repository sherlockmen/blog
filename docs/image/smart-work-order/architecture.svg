<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <style>
    .title { font: 700 30px 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 18px 'Helvetica Neue', Arial, sans-serif; fill: #475569; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2.2; rx: 14; ry: 14; }
    .box2 { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.2; rx: 14; ry: 14; }
    .box3 { fill: #ecfeff; stroke: #0f766e; stroke-width: 2.2; rx: 14; ry: 14; }
    .text { font: 700 22px 'Helvetica Neue', Arial, sans-serif; fill: #111827; }
    .sub { font: 18px 'Helvetica Neue', Arial, sans-serif; fill: #334155; }
    .line { stroke: #475569; stroke-width: 3; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1280" height="820" fill="#ffffff"/>

  <text x="40" y="50" class="title">cs-unite-workorder-plus 总体架构</text>
  <text x="40" y="82" class="subtitle">对外接口从 Service 进入，核心编排在 Core，Manager / DAL 负责数据聚合，Integration 负责外部平台适配</text>

  <rect x="70" y="140" width="200" height="92" class="box"/>
  <text x="132" y="178" class="text">调用方</text>
  <text x="105" y="208" class="sub">前端 / 外部系统</text>

  <rect x="350" y="140" width="220" height="92" class="box2"/>
  <text x="438" y="178" class="text">API / DTO</text>
  <text x="385" y="208" class="sub">Dubbo 接口与数据契约</text>

  <rect x="650" y="140" width="230" height="92" class="box2"/>
  <text x="735" y="178" class="text">Service</text>
  <text x="685" y="208" class="sub">鉴权、参数转换、异常翻译</text>

  <rect x="960" y="140" width="220" height="92" class="box3"/>
  <text x="1038" y="178" class="text">Core</text>
  <text x="988" y="208" class="sub">状态推进与业务编排</text>

  <rect x="150" y="360" width="250" height="110" class="box"/>
  <text x="230" y="405" class="text">Manager</text>
  <text x="184" y="438" class="sub">领域聚合、多表查询、BO 组装</text>

  <rect x="500" y="360" width="250" height="110" class="box"/>
  <text x="595" y="405" class="text">DAL</text>
  <text x="545" y="438" class="sub">Mapper / XML / DO / SQL</text>

  <rect x="850" y="360" width="280" height="110" class="box3"/>
  <text x="930" y="405" class="text">Integration</text>
  <text x="888" y="438" class="sub">Workflow / CMS / ASR / OCR / OSS</text>

  <rect x="90" y="600" width="290" height="122" class="box"/>
  <text x="170" y="646" class="text">Redis / 缓存</text>
  <text x="126" y="680" class="sub">规则进度、模型状态、异常冷却</text>

  <rect x="430" y="600" width="320" height="122" class="box"/>
  <text x="523" y="646" class="text">Spring Event</text>
  <text x="465" y="680" class="sub">FlowEvent / Listener / Handler</text>

  <rect x="800" y="600" width="340" height="122" class="box3"/>
  <text x="915" y="646" class="text">Task / Job</text>
  <text x="850" y="680" class="sub">智能判责后台任务与定时执行</text>

  <path d="M270 186 L350 186" class="line"/>
  <path d="M570 186 L650 186" class="line"/>
  <path d="M880 186 L960 186" class="line"/>

  <path d="M1070 232 L1070 320 L990 320 L990 360" class="line"/>
  <path d="M960 415 L750 415" class="line"/>
  <path d="M500 415 L400 415" class="line"/>

  <path d="M990 470 L990 600" class="line"/>
  <path d="M990 500 L590 500 L590 600" class="line"/>
  <path d="M990 530 L235 530 L235 600" class="line"/>
</svg>
