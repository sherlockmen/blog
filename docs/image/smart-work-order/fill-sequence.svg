<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930">
  <style>
    .title { font: 700 30px 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 18px 'Helvetica Neue', Arial, sans-serif; fill: #475569; }
    .actor { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.2; rx: 8; ry: 8; }
    .text { font: 700 18px 'Helvetica Neue', Arial, sans-serif; fill: #111827; }
    .sub { font: 16px 'Helvetica Neue', Arial, sans-serif; fill: #334155; }
    .life { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; }
    .msg { stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1600" height="930" fill="#ffffff"/>

  <text x="40" y="44" class="title">“补充工单”时序图</text>
  <text x="40" y="76" class="subtitle">Service 做鉴权和参数转换，Core 负责落库和流程推进，事件链再触发文件解析与历史记录</text>

  <rect x="40" y="100" width="130" height="52" class="actor"/><text x="80" y="133" class="text">前端</text>
  <rect x="255" y="100" width="240" height="52" class="actor"/><text x="298" y="133" class="text">SmartOrderTaskServiceImpl</text>
  <rect x="580" y="100" width="180" height="52" class="actor"/><text x="628" y="133" class="text">OrderTaskCore</text>
  <rect x="845" y="100" width="180" height="52" class="actor"/><text x="890" y="133" class="text">SmartOrderCore</text>
  <rect x="1110" y="100" width="190" height="52" class="actor"/><text x="1155" y="133" class="text">事件监听链</text>
  <rect x="1385" y="100" width="160" height="52" class="actor"/><text x="1425" y="133" class="text">文件分析</text>

  <line x1="105" y1="152" x2="105" y2="870" class="life"/>
  <line x1="375" y1="152" x2="375" y2="870" class="life"/>
  <line x1="670" y1="152" x2="670" y2="870" class="life"/>
  <line x1="935" y1="152" x2="935" y2="870" class="life"/>
  <line x1="1205" y1="152" x2="1205" y2="870" class="life"/>
  <line x1="1465" y1="152" x2="1465" y2="870" class="life"/>

  <path d="M105 205 L375 205" class="msg"/><text x="150" y="194" class="sub">1. fullSmartOrder(req)</text>
  <path d="M375 275 L670 275" class="msg"/><text x="430" y="264" class="sub">2. DTO -&gt; BO，调用 appealSmartOrder</text>
  <path d="M670 345 L670 345" class="msg"/><text x="700" y="350" class="sub">3. 批量保存模板字段、附件、简化单</text>
  <path d="M670 415 L670 415" class="msg"/><text x="700" y="420" class="sub">4. 更新主表状态、标签和人员信息</text>
  <path d="M670 495 L935 495" class="msg"/><text x="735" y="484" class="sub">5. completeTask(flowBO)</text>
  <path d="M670 575 L1205 575" class="msg"/><text x="810" y="564" class="sub">6. publish SmartOrderFlowEvent</text>
  <path d="M1205 655 L1465 655" class="msg"/><text x="1260" y="644" class="sub">7. doFileAnalysis(flowBO)</text>
  <path d="M1205 735 L1205 735" class="msg"/><text x="1240" y="740" class="sub">8. 写入 task_history</text>
  <path d="M670 815 L375 815" class="msg"/><text x="485" y="804" class="sub">9. 返回处理结果</text>
  <path d="M375 855 L105 855" class="msg"/><text x="205" y="844" class="sub">10. Result.OK</text>
</svg>
