<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1030" viewBox="0 0 1680 1030">
  <style>
    .title { font: 700 30px 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 18px 'Helvetica Neue', Arial, sans-serif; fill: #475569; }
    .actor { fill: #ecfeff; stroke: #0f766e; stroke-width: 2.2; rx: 8; ry: 8; }
    .text { font: 700 18px 'Helvetica Neue', Arial, sans-serif; fill: #111827; }
    .sub { font: 16px 'Helvetica Neue', Arial, sans-serif; fill: #334155; }
    .life { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; }
    .msg { stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1680" height="1030" fill="#ffffff"/>

  <text x="40" y="44" class="title">“智能判责后台任务”时序图</text>
  <text x="40" y="76" class="subtitle">定时任务先做互斥和异常检查，再进入规则执行、可信度判断、结果回写与工作流推进</text>

  <rect x="30" y="100" width="235" height="52" class="actor"/><text x="92" y="133" class="text">SimpleAndDutyOrderJobImpl</text>
  <rect x="325" y="100" width="140" height="52" class="actor"/><text x="370" y="133" class="text">Redis</text>
  <rect x="525" y="100" width="175" height="52" class="actor"/><text x="572" y="133" class="text">OrderTaskCore</text>
  <rect x="760" y="100" width="230" height="52" class="actor"/><text x="808" y="133" class="text">SmartorderInfoManager</text>
  <rect x="1050" y="100" width="165" height="52" class="actor"/><text x="1090" y="133" class="text">RuleExecCore</text>
  <rect x="1275" y="100" width="175" height="52" class="actor"/><text x="1320" y="133" class="text">SmartOrderCore</text>
  <rect x="1510" y="100" width="130" height="52" class="actor"/><text x="1542" y="133" class="text">Workflow</text>

  <line x1="147" y1="152" x2="147" y2="960" class="life"/>
  <line x1="395" y1="152" x2="395" y2="960" class="life"/>
  <line x1="612" y1="152" x2="612" y2="960" class="life"/>
  <line x1="875" y1="152" x2="875" y2="960" class="life"/>
  <line x1="1132" y1="152" x2="1132" y2="960" class="life"/>
  <line x1="1362" y1="152" x2="1362" y2="960" class="life"/>
  <line x1="1575" y1="152" x2="1575" y2="960" class="life"/>

  <path d="M147 205 L395 205" class="msg"/><text x="198" y="194" class="sub">1. 检查运行中标记和异常冷却</text>
  <path d="M147 285 L612 285" class="msg"/><text x="320" y="274" class="sub">2. runExecuteTask(order)</text>
  <path d="M612 365 L875 365" class="msg"/><text x="680" y="354" class="sub">3. querySmartOrderDetailById(orderId)</text>
  <path d="M612 445 L1132 445" class="msg"/><text x="790" y="434" class="sub">4. execute(detailBO)</text>
  <path d="M1132 525 L395 525" class="msg"/><text x="760" y="514" class="sub">5. 写入规则执行进度缓存</text>
  <path d="M612 605 L612 605" class="msg"/><text x="650" y="610" class="sub">6. 判断有责 / 异常 / 重试 / 是否可信</text>
  <path d="M612 695 L1362 695" class="msg"/><text x="875" y="684" class="sub">7. updateSmartOrderByJob(...)</text>
  <path d="M612 785 L1362 785" class="msg"/><text x="890" y="774" class="sub">8. completeTask(flowBO)</text>
  <path d="M1362 865 L1575 865" class="msg"/><text x="1425" y="854" class="sub">9. workflow.completeTask</text>
  <path d="M612 935 L395 935" class="msg"/><text x="455" y="924" class="sub">10. 清理运行中标记</text>
</svg>
