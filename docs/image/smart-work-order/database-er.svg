<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1200" viewBox="0 0 1840 1200">
  <style>
    .title { font: 700 30px 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 18px 'Helvetica Neue', Arial, sans-serif; fill: #475569; }
    .headerMain { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.2; rx: 14; ry: 14; }
    .headerChild { fill: #ecfeff; stroke: #0f766e; stroke-width: 2.2; rx: 14; ry: 14; }
    .headerRule { fill: #fef3c7; stroke: #d97706; stroke-width: 2.2; rx: 14; ry: 14; }
    .headerFlow { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 2.2; rx: 14; ry: 14; }
    .th { font: 700 22px 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; }
    .meta { font: 15px 'Helvetica Neue', Arial, sans-serif; fill: #475569; }
    .field { font: 16px 'Helvetica Neue', Arial, sans-serif; fill: #111827; }
    .pk { font: 700 16px 'Helvetica Neue', Arial, sans-serif; fill: #b91c1c; }
    .fk { font: 700 16px 'Helvetica Neue', Arial, sans-serif; fill: #0f766e; }
    .line { stroke: #475569; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    .hint { font: 15px 'Helvetica Neue', Arial, sans-serif; fill: #334155; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1840" height="1200" fill="#ffffff"/>

  <text x="40" y="50" class="title">cs-unite-workorder-plus 数据库 ER 关系图</text>
  <text x="40" y="82" class="subtitle">主表负责当前业务态，二级表负责动态字段、附件、责任结果和流程历史，底层表负责规则与简化单扩展</text>

  <rect x="705" y="110" width="430" height="240" class="headerMain"/>
  <text x="840" y="145" class="th">t_smartorder_info</text>
  <text x="845" y="170" class="meta">工单主表 / 当前业务快照</text>
  <text x="735" y="205" class="pk">PK id</text>
  <text x="735" y="232" class="field">order_number 工单流水号</text>
  <text x="735" y="259" class="field">order_type_id / order_type_code 工单类型</text>
  <text x="735" y="286" class="field">order_status 当前状态</text>
  <text x="735" y="313" class="field">inst_no 流程实例号</text>
  <text x="735" y="340" class="field">reviewer / writter / simply / smart_responsible</text>

  <rect x="90" y="450" width="350" height="220" class="headerChild"/>
  <text x="160" y="485" class="th">t_smartorder_field</text>
  <text x="153" y="510" class="meta">模板字段表 / 动态表单值</text>
  <text x="120" y="545" class="pk">PK id</text>
  <text x="120" y="572" class="fk">FK order_id -&gt; info.id</text>
  <text x="120" y="599" class="field">field_code / field_type / field_title</text>
  <text x="120" y="626" class="field">field_value / field_comment / sort</text>
  <text x="120" y="653" class="field">data_source / description</text>

  <rect x="500" y="450" width="360" height="240" class="headerChild"/>
  <text x="585" y="485" class="th">t_smartorder_file</text>
  <text x="570" y="510" class="meta">附件表 / 支持录音文本</text>
  <text x="530" y="545" class="pk">PK id</text>
  <text x="530" y="572" class="fk">FK order_id -&gt; info.id</text>
  <text x="530" y="599" class="fk">FK field_id -&gt; field.id</text>
  <text x="530" y="626" class="field">file_source / file_type / file_name</text>
  <text x="530" y="653" class="field">file_url / remark / record_text</text>
  <text x="530" y="680" class="field">standard_name</text>

  <rect x="910" y="450" width="360" height="240" class="headerChild"/>
  <text x="960" y="485" class="th">t_smartorder_responsible</text>
  <text x="970" y="510" class="meta">责任结果表 / 一单一条</text>
  <text x="940" y="545" class="pk">PK id</text>
  <text x="940" y="572" class="fk">UK order_id -&gt; info.id</text>
  <text x="940" y="599" class="field">responsible_basis / responsible_problem</text>
  <text x="940" y="626" class="field">review_remark / responsible_situation</text>
  <text x="940" y="653" class="field">smart_responsible_basis / model_score</text>
  <text x="940" y="680" class="field">human_responsible_situation / exception_order</text>

  <rect x="1320" y="450" width="340" height="210" class="headerFlow"/>
  <text x="1370" y="485" class="th">t_smartorder_task_history</text>
  <text x="1405" y="510" class="meta">流程历史表</text>
  <text x="1350" y="545" class="pk">PK id</text>
  <text x="1350" y="572" class="fk">FK order_id -&gt; info.id</text>
  <text x="1350" y="599" class="field">task_id / opera_user / node_name</text>
  <text x="1350" y="626" class="field">order_status / result / opera_name</text>

  <rect x="80" y="860" width="180" height="160" class="headerChild"/>
  <text x="102" y="895" class="th">t_smartorder_tag</text>
  <text x="130" y="920" class="meta">标签表</text>
  <text x="105" y="955" class="pk">PK id</text>
  <text x="105" y="982" class="fk">FK order_id -&gt; info.id</text>

  <rect x="330" y="850" width="300" height="190" class="headerChild"/>
  <text x="375" y="885" class="th">t_smartorder_simply</text>
  <text x="388" y="910" class="meta">简化单主表</text>
  <text x="360" y="945" class="pk">PK id</text>
  <text x="360" y="972" class="fk">FK order_id -&gt; info.id</text>
  <text x="360" y="999" class="field">simply_type / simply_remark</text>

  <rect x="700" y="850" width="330" height="220" class="headerChild"/>
  <text x="750" y="885" class="th">t_smartorder_simply_file</text>
  <text x="785" y="910" class="meta">简化单附件表</text>
  <text x="730" y="945" class="pk">PK id</text>
  <text x="730" y="972" class="fk">FK simply_id -&gt; simply.id</text>
  <text x="730" y="999" class="field">file_type / file_name / file_url</text>
  <text x="730" y="1026" class="field">field_title / field_type / record_text</text>

  <rect x="1090" y="850" width="310" height="210" class="headerRule"/>
  <text x="1130" y="885" class="th">t_smartorder_rule_info</text>
  <text x="1160" y="910" class="meta">规则定义表</text>
  <text x="1120" y="945" class="pk">PK id</text>
  <text x="1120" y="972" class="field">rule_name / description</text>
  <text x="1120" y="999" class="field">expression_config / rule_status</text>
  <text x="1120" y="1026" class="field">rule_dict_code / other_explanations</text>

  <rect x="1450" y="840" width="320" height="250" class="headerRule"/>
  <text x="1485" y="875" class="th">t_smartorder_rule_result_info</text>
  <text x="1540" y="900" class="meta">规则执行结果表</text>
  <text x="1480" y="935" class="pk">PK id</text>
  <text x="1480" y="962" class="fk">FK order_id -&gt; info.id</text>
  <text x="1480" y="989" class="field">rule_name / rule_code / detection_status</text>
  <text x="1480" y="1016" class="field">has_responsibility / result_basis / score</text>
  <text x="1480" y="1043" class="field">execution_duration / responsible_id</text>

  <path d="M840 350 L840 390 L265 390 L265 450" class="line"/>
  <text x="520" y="378" class="hint">1:N 动态字段</text>

  <path d="M900 350 L900 390 L680 390 L680 450" class="line"/>
  <text x="790" y="378" class="hint">1:N 附件</text>

  <path d="M960 350 L960 390 L1090 390 L1090 450" class="line"/>
  <text x="995" y="378" class="hint">1:1 当前责任结果</text>

  <path d="M1020 350 L1020 390 L1490 390 L1490 450" class="line"/>
  <text x="1245" y="378" class="hint">1:N 流程历史</text>

  <path d="M780 350 L780 390 L480 390 L480 850" class="line"/>
  <text x="530" y="650" class="hint">1:1 或 1:0 简化单</text>

  <path d="M700 350 L700 390 L50 390 L50 940 L80 940" class="line"/>
  <text x="145" y="378" class="hint">1:N 标签</text>

  <path d="M440 640 L500 640" class="line"/>
  <text x="430" y="620" class="hint">1:N 字段级附件</text>

  <path d="M630 960 L700 960" class="line"/>
  <text x="610" y="940" class="hint">1:N 简化单附件</text>

  <path d="M1050 350 L1050 390 L1800 390 L1800 965 L1770 965" class="line"/>
  <text x="1480" y="378" class="hint">1:N 规则执行结果</text>

  <path d="M1120 690 L1120 760 L1610 760 L1610 840" class="line"/>
  <text x="1300" y="742" class="hint">responsible_id 结果汇总引用</text>

  <path d="M1400 955 L1450 955" class="line"/>
  <text x="1340" y="935" class="hint">rule_code 业务关联</text>

  <text x="40" y="1130" class="subtitle">说明：rule_result 通过 order_id 归属工单，通过 responsible_id 指向责任结果汇总；rule_info 与结果表主要通过规则编码做业务关联，不一定有数据库外键。</text>
</svg>
