    <style>
        :root {
            --pt-bg: #f8fafc;
            --pt-card-bg: #ffffff;
            --pt-border: #e6ebf2;
            --pt-border-hover: #d7e0ea;
            --pt-text: #1f2937;
            --pt-subtext: #6b7280;
            --pt-primary: #2563eb;
            --pt-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
            --pt-shadow-hover: 0 10px 28px rgba(15, 23, 42, 0.10);
            --pt-radius: 16px;
            --pt-inner-radius: 12px;
        }

        /* docsify 内容区不要太宽，不然会显得 iframe 右边空很多 */
        .markdown-section {
            max-width: 1100px;
        }

        /* 外层卡片 */
        .pytutor-wrapper {
            margin: 20px 0 28px;
            padding: 16px;
            background: linear-gradient(180deg, #fcfdff 0%, #f8fafc 100%);
            border: 1px solid var(--pt-border);
            border-radius: var(--pt-radius);
            box-shadow: var(--pt-shadow);
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .pytutor-wrapper:hover {
            border-color: var(--pt-border-hover);
            box-shadow: var(--pt-shadow-hover);
        }

        /* 顶部工具栏 */
        .pytutor-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--pt-border);
        }

        /* 标题 */
        .pytutor-toolbar .lang-badge,
        .pytutor-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--pt-text);
            line-height: 1.2;
            letter-spacing: 0.2px;
        }

        /* 按钮 */
        .pytutor-toolbar button,
        .pytutor-wrapper .copy-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 34px;
            padding: 0 14px;
            border: 1px solid #d7dee8;
            border-radius: 8px;
            background: #fff;
            color: #374151;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .pytutor-toolbar button:hover,
        .pytutor-wrapper .copy-btn:hover {
            border-color: #c8d3df;
            background: #f8fafc;
            color: var(--pt-primary);
        }

        .pytutor-toolbar button:active,
        .pytutor-wrapper .copy-btn:active {
            transform: translateY(1px);
        }

        /* iframe 外层可选容器 */
        .pytutor-frame-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 关键：让 iframe 不要过宽、不过高，尽量自适应 */
        .pytutor-wrapper iframe {
            display: block;
            width: 100%;
            max-width: 960px;         /* 限制最大宽度，避免右侧大空白 */
            margin: 0 auto;           /* 居中 */
            border: 1px solid var(--pt-border);
            border-radius: var(--pt-inner-radius);
            background: var(--pt-card-bg);
            box-sizing: border-box;
            overflow: hidden;

            /* 关键自适应比例，减少底部和右侧空白 */
            aspect-ratio: 2.35 / 1;

            /* 给一个兜底高度范围 */
            min-height: 400px;
            max-height: 500px;
            height: auto;
        }

        /* 底部说明 */
        .pytutor-note {
            margin-top: 12px;
            padding-left: 2px;
            font-size: 13px;
            line-height: 1.6;
            color: var(--pt-subtext);
        }

        /* 如果你有单独的正文容器，可以顺带统一 */
        .pytutor-body {
            display: block;
        }

        /* 代码说明、辅助文字 */
        .pytutor-desc {
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.6;
            color: var(--pt-subtext);
        }

        /* 小屏适配 */
        @media (max-width: 992px) {
            .markdown-section {
                max-width: 100%;
            }

            .pytutor-wrapper iframe {
                max-width: 100%;
                aspect-ratio: 2.1 / 1;
                min-height: 380px;
                max-height: 460px;
            }
        }

        @media (max-width: 768px) {
            .pytutor-wrapper {
                padding: 12px;
                border-radius: 14px;
            }

            .pytutor-toolbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .pytutor-toolbar .lang-badge,
            .pytutor-title {
                font-size: 16px;
            }

            .pytutor-wrapper iframe {
                max-width: 100%;
                aspect-ratio: 1.6 / 1;
                min-height: 340px;
                max-height: 420px;
                border-radius: 10px;
            }
        }

        @media (max-width: 480px) {
            .pytutor-wrapper {
                padding: 10px;
                margin: 16px 0 22px;
            }

            .pytutor-wrapper iframe {
                aspect-ratio: 1.35 / 1;
                min-height: 300px;
                max-height: 380px;
            }

            .pytutor-toolbar button,
            .pytutor-wrapper .copy-btn {
                height: 32px;
                padding: 0 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<div id="app">loading...</div>
<script>
    window.$docsify = {
        name: '<span>blog</span>',
        nameLink: '#/README.md',
        mergeNavbar: true,
        coverpage: true,
        loadNavbar: false,
        loadSidebar: true,
        subMaxLevel: 5,
        // 发生产的时候要加上这个
        basePath: '/blog/',
        count: {
            countable: true,
            fontsize: '0.9em',
            color: 'rgb(90,90,90)',
            language: 'chinese'
        },
        pagination: {
            previousText: '上一章节',
            // or
            nextText: {
                '/en/': 'NEXT',
                '/': '下一章节'
            },
            crossChapter: true,
            crossChapterText: true,
        },
        plantuml: {
            skin: 'default',
        },
        'flexible-alerts': {
            note: {
                label: "Hinweis"
            },
            tip: {
                label: "Tipp"
            },
            warning: {
                label: "Warnung"
            },
            attention: {
                label: "Achtung"
            },
            comment: {
                label: 'Comment',

                // localization
                label: {
                    '/en-GB/': 'Comment',
                    '/': 'Kommentar'
                },

                // Assuming that we use Font Awesome
                icon: 'fa fa-comment',
                className: 'note'
            }

        },
        progress: {
            position: "top",
            color: "var(--theme-color,#42b983)",
            height: "3px",
        },
        tabs: {
            persist: true, // default
            sync: true, // default
            theme: 'classic', // default
            tabComments: true, // default
            tabHeadings: true // default
        },
        timeUpdater: {
            text: ">[!TIP]最后更新时间{docsify-updated}",
            formatUpdated: "{YYYY}年{MM}月{DD}日-{HH}:{mm}:{ss}",
            whereToPlace: "top",
        },
        slider: {
            auto: true,
            intervalTime: 20000,
            hideToolbar: true,
        },
        plugins: [
            function (hook, vm) {
                hook.doneEach(function () {
                    if (window.renderPyTutorBlocks) {
                        window.renderPyTutorBlocks();
                    }
                });
            }
        ]
    }
</script>
