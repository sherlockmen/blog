<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SherlockMen</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="description" content="Description">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <link rel="icon" type="image/x-icon" href="./image/ico/favicon.ico">
    <!--top banner样式-->
    <link href="https://cdn.jsdelivr.net/npm/docsify-top-banner-plugin@0.4.0/dist/style.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-xpost/docsify-xpost.css"/>
    <!--图片滑块插件样式-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-image-slider@latest/dist/slider.min.css">
    <!--xmind预览样式-->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/gh/AntHubTC/docsify-xmind@1.0/example/dist/index.min.css"/>
    <!--frontawesome样式-->
    <link rel="stylesheet" href="//unpkg.com/@fortawesome/fontawesome-free/css/fontawesome.css"/>
    <link rel="stylesheet" href="//unpkg.com/@fortawesome/fontawesome-free/css/brands.css"/>
    <link rel="stylesheet" href="//unpkg.com/@fortawesome/fontawesome-free/css/regular.css"/>
    <link rel="stylesheet" href="//unpkg.com/@fortawesome/fontawesome-free/css/solid.css"/>
    <!--可折叠插件样式-->
    <link rel="stylesheet" href="//unpkg.com/docsify-accordion/src/style.css">
    <!--首页dashboard样式-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-dashboard@3.1.0/dist/dashboard.min.css">
</head>
<body>
<div id="app">loading...</div>
<script>
    window.$docsify = {
        name: '<span>blog</span>',
        nameLink: '#/README.md',
        mergeNavbar: true,
        coverpage: true,
        loadNavbar: false,
        loadSidebar: true,
        subMaxLevel: 5,
        // 发生产的时候要加上这个
        basePath: '/blog/',
        count: {
            countable: true,
            fontsize: '0.9em',
            color: 'rgb(90,90,90)',
            language: 'chinese'
        },
        pagination: {
            previousText: '上一章节',
            // or
            nextText: {
                '/en/': 'NEXT',
                '/': '下一章节'
            },
            crossChapter: true,
            crossChapterText: true,
        },
        plantuml: {
            skin: 'default',
        },
        'flexible-alerts': {
            note: {
                label: "Hinweis"
            },
            tip: {
                label: "Tipp"
            },
            warning: {
                label: "Warnung"
            },
            attention: {
                label: "Achtung"
            },
            comment: {
                label: 'Comment',

                // localization
                label: {
                    '/en-GB/': 'Comment',
                    '/': 'Kommentar'
                },

                // Assuming that we use Font Awesome
                icon: 'fa fa-comment',
                className: 'note'
            }

        },
        progress: {
            position: "top",
            color: "var(--theme-color,#42b983)",
            height: "3px",
        },
        tabs: {
            persist: true, // default
            sync: true, // default
            theme: 'classic', // default
            tabComments: true, // default
            tabHeadings: true // default
        },
        timeUpdater: {
            text: ">[!TIP]最后更新时间{docsify-updated}",
            formatUpdated: "{YYYY}年{MM}月{DD}日-{HH}:{mm}:{ss}",
            whereToPlace: "top",
        },
        slider: {
            auto: true,
            intervalTime: 20000,
            hideToolbar: true,
        },
        pytutor: {
            baseEmbedUrl: 'https://pythontutor.com/iframe-embed.html',
            defaultOptions: {
                cumulative: 'false',
                curInstr: '0',
                heapPrimitives: 'nevernest',
                drawParentPointers: 'false',
                textReferences: 'false',
                showOnlyOutputs: 'false'
            },
            ui: {
                copyButtonText: '复制代码',
                copiedButtonText: '已复制',
                copyFailedText: '复制失败',
                showNote: false,
                noteText: '说明：适合小段教学示例代码，不适合复杂项目代码。',
                maxWidth: '960px',
                baseHeight: 420,
                lineHeight: 24,
                minHeight: 420,
                maxHeight: 900,
                mobileMinHeight: 360
            }
        }
    }
</script>
<!-- Docsify v4 -->
<script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
<!--emoji-->
<script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
<!--java语法高亮-->
<script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-java.min.js"></script>
<!--Python语法高亮-->
<script src="https://unpkg.com/prismjs/components/prism-python.min.js"></script>
<!--count-->
<script src="//unpkg.com/docsify-count/dist/countable.js"></script>
<!--搜索插件-->
<script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
<!--翻页插件-->
<script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
<!--代码复制到剪切板插件-->
<script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
<!--终端代码插件-->
<script src="https://cdn.jsdelivr.net/npm/docsify-terminal-block@1.0.3"></script>
<!--plantuml-->
<script src="//unpkg.com/docsify-puml/dist/docsify-puml.min.js"></script>
<!--图片放缩-->
<script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
<!--xmind插件-->
<script src="//cdn.jsdelivr.net/gh/AntHubTC/docsify-xmind@1.0/example/dist/index.min.js"></script>
<!-- note美化插件 -->
<script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>
<!-- Font Awesome CSS-->
<script src="//unpkg.com/docsify-fontawesome/dist/docsify-fontawesome.min.js"></script>
<!--阅读进度插件-->
<script src="https://cdn.jsdelivr.net/npm/docsify-progress@latest/dist/progress.min.js"></script>
<!--&lt;!&ndash;table插件&ndash;&gt;-->
<!--<script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>-->
<!--GIF图片插件-->
<link rel="stylesheet" href="//unpkg.com/docsify-gifcontrol/dist/docsify-gifcontrol.css">
<script src="//unpkg.com/docsify-gifcontrol/dist/docsify-gifcontrol.js"></script>
<!--顶部横幅插件-->
<script src="https://cdn.jsdelivr.net/npm/docsify-top-banner-plugin@0.4.0/dist/index.min.js"></script>
<!--markdown更新时间插件-->
<script src="https://cdn.jsdelivr.net/npm/docsify-updated/src/time-updater.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-updated/src/time-updater.js"></script>
<!--站点访问量插件-->
<!--<script src="https://unpkg.com/docsify-busuanzi@1.0.1/dist/docsify-busuanzi.min.js"></script>-->
<!--图像滑块插件-->
<script src="//cdn.jsdelivr.net/npm/docsify-image-slider@latest/dist/docsify-image-slider.min.js"></script>
<!--X帖子内容块插件-->
<script src="https://cdn.jsdelivr.net/npm/docsify-xpost/docsify-xpost.js"></script>
<!--可折叠样式插件-->
<script src="//unpkg.com/docsify-accordion/src/index.js"></script>
<!--table插件-->
<script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.js"></script>
<!--drawio插件-->
<script type="text/javascript" src="https://viewer.diagrams.net/js/viewer-static.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/sherlockmen/docsify-pytutor@v1.0.0/dist/docsify-pytutor.js"></script>
<script src='//cdn.jsdelivr.net/npm/drawcsify@latest'></script>
</body>
</html>
